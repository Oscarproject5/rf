<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Love Water RGV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #000, #1a1a2e);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    
    .container {
      max-width: 400px;
      width: 100%;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #9ca3af;
      margin-bottom: 2rem;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    button {
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    
    button:hover {
      transform: translateY(-2px);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .secondary {
      background: transparent;
      border: 2px solid #374151;
      color: #9ca3af;
    }
    
    .secondary:hover {
      border-color: #4b5563;
      color: #d1d5db;
    }
    
    .contact-info {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #374151;
    }
    
    .contact-info h3 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    
    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      color: #9ca3af;
    }
    
    .contact-item a {
      color: #8b5cf6;
      text-decoration: none;
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 1rem;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      .icon {
        width: 60px;
        height: 60px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">💧</div>
    <h1>You're Offline</h1>
    <p>
      No internet connection detected. Don't worry - you can still access some features 
      and contact us directly when you're back online.
    </p>
    
    <div class="actions">
      <button onclick="window.location.reload()">
        Try Again
      </button>
      <button class="secondary" onclick="history.back()">
        Go Back
      </button>
    </div>
    
    <div class="contact-info">
      <h3>Contact Us Directly</h3>
      <div class="contact-item">
        📞 <a href="tel:+19561234567">(956) 123-4567</a>
      </div>
      <div class="contact-item">
        💬 <a href="https://wa.me/19561234567">WhatsApp</a>
      </div>
      <div class="contact-item">
        ✉️ <a href="mailto:info@lovewaterrgv.com">info@lovewaterrgv.com</a>
      </div>
    </div>
  </div>
  
  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', () => {
      window.location.reload()
    })
    
    // Show connection status
    function updateConnectionStatus() {
      if (navigator.onLine) {
        document.body.style.background = 'linear-gradient(135deg, #10b981, #34d399)'
        setTimeout(() => {
          window.location.reload()
        }, 1000)
      }
    }
    
    setInterval(updateConnectionStatus, 5000)
  </script>
</body>
</html>
